[bar/mybar]
height = 35
modules-left = i3
modules-right = temperature memory cpu battery1 date
;tray-position = right
font-0 = Noto Sans Mono:style=Regular:size=14
!font-1 = unifont:fontformat=truetype:size=18:antialias=false;0
font-1 = "Font Awesome 6 Free Solid:pixelsize=16;2"
font-2 = "Adwaita Mono:pixelsize=14;2"
font-3 = "Font Awesome 6 Brands:pixelsize=16;2"
font-4 = "Font Awesome 6 Free Solid:scale=5;5"
;height = 30
bottom = false
;background = ${colors.red}
;border-bottom-size = 2
;border-bottom-color = ${colors.green}


[bar/bottom]
width = 70%
height = 40
offset-x = 15%
offset-y = -5
;background = #CC1E1E2E
;background = #dd1e1e2e
;foreground = #ffffff
fixed-center = true
override-redirect = true
;radius = 12

padding-left = 2
padding-right = 2

radius-top-left = 20
radius-top-right = 20
radius-bottom-left = 20
radius-bottom-right = 20

modules-center = wlan filesystem backlight pulseaudio tray xwindow
bottom = true
font-0 = ${bar/mybar.font-0}
font-1 = ${bar/mybar.font-1}
font-2 = Noto Color Emoji:style=Regular:scale=7;0"
font-3 = "Font Awesome 6 Brands:pixelsize=16;2"
font-4 = "Font Awesome 6 Free Solid:scale=5;5"
font-5 = "Symbols Nerd Font:style=Regular:scale=5"
enable-ipc = true

[settings]
pseudo-transparency = true

[colors]
black = #000
white = #fff
grey = #aaa
darkgrey = #555
red = #f00
green = #0f0

[module/date]
type = internal/date
;interval = 1
; This will display time like: 03:25 PM
;time = %I:%M %p

; Optional alternative format when clicked (displays seconds)
;time-alt = %I:%M:%S %p
date = " | %d-%h-%y %l:%M %p"


[module/battery-alt]
type=external/script
exec=acpi | cut -d ' ' -f 4 |grep -E "*%" 2>/dev/null
interval=30
tail=true

[module/battery1]
type = custom/script
exec = ~/.config/polybar/scripts/battery.pl
interval = 5

[module/battery]
type = internal/battery
;full-at = 80
low-at = 20
battery = BAT0
adapter = AC
poll-interval = 5

time-format = %H:%M
format-charging = "| <animation-charging> <label-charging>"
format-discharging = "| <ramp-capacity> <label-discharging>"
format-full = "| <ramp-capacity> <label-full>"
label-charging = "Charge %percentage%%"
label-discharging = "Discharge %percentage%%"
label-full = "| Fully charged %percentage%%"
label-low = "| BATTERY LOW %percentage%%"

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

bar-capacity-width = 10
!bar-capacity-height = 20

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
; Framerate in milliseconds
animation-charging-framerate = 750

animation-discharging-0 = 
animation-discharging-1 = 
animation-discharging-2 = 
animation-discharging-3 = 
animation-discharging-4 = 
; Framerate in milliseconds
animation-discharging-framerate = 500
animation-low-0 = !
animation-low-1 = 
animation-low-framerate = 200

[module/filesystem]
type = internal/fs
interval = 60
mount-0 = /
;mount-1 = /mnt/arch
;mount-2 = /data
label-mounted = "%{F#0a81f5}  Disk: %{F-} %percentage_used%% "
;hidden = true

;[module/lan]
;type = internal/network
;interface = eth0
;label-connected = "%ifname%: %local_ip% %local_ip6% | "
;label-disconnected = "%ifname%: not connected | "

[module/wlan]
type = internal/network
interface = wlp3s0
;format-connected = 
label-connected = "%{F#00F000} %essid% %signal%%  %downspeed%   %upspeed% %{F-}| "
;label-connected = "%ifname%: %essid% %signal%%  %{F#00F000}%local_ip% %{F#F000F0}%local_ip6% %{F-} | "
;label-disconnected = "%ifname%: not connected | "
label-disconnected = "%{F#00F000} %ifname%: not connected{F-}| "

[module/temperature]
type = internal/temperature
interval = 0.5
thermal-zone = 0
zone-type = acpitz
hwmon-path = /sys/devices/platform/thinkpad_hwmon/hwmon/hwmon6/temp1_input
base-temperature = 20
warn-temperature = 70
format = "| <ramp> <label> "
format-warn = "| <ramp> <label-warn> "
label = "%{F#00F000} TEMP:%{F-} %temperature-c%"
label-warn = "TEMP: %temperature-c%"
label-warn-foreground = #f00
ramp-0 = 
ramp-1 = 
ramp-2 = 
;ramp-foreground = #55

[module/memory]
type = internal/memory
interval = 3
warn-percentage = 95

format = <label> <bar-used>
label = |  %{F#00F000}RAM%{F-} %gb_used%/%gb_free%
label-warn = | RAM %gb_used%/%gb_free%

bar-used-indicator =
bar-used-width = 10
bar-used-foreground-0 = #55aa55
bar-used-foreground-1 = #557755
bar-used-foreground-2 = #f5a70a
bar-used-foreground-3 = #ff5555
bar-used-fill = ▐
bar-used-empty = ▐
bar-used-empty-foreground = #444444

[module/cpu]
type = internal/cpu
format = "<label> <ramp-coreload> "
label = " |  %{F#00F000} CPU %{F-}%percentage%%"
ramp-coreload-spacing = 1
ramp-coreload-0 = %{F#0a0}▁%{F-}
ramp-coreload-1 = %{F#0a0}▂%{F-}
ramp-coreload-2 = %{F#0a0}▃%{F-}
ramp-coreload-3 = %{F#0a0}▄%{F-}
ramp-coreload-4 = %{F#f80}▅%{F-}
ramp-coreload-5 = %{F#f80}▆%{F-}
ramp-coreload-6 = %{F#f00}▇%{F-}
ramp-coreload-7 = %{F#f00}█%{F-}

[module/i3]
type = internal/i3

label-focused = %index%
label-focused-background = ${colors.darkgrey}
label-focused-foreground = ${colors.white}
;label-focused-underline= ${colors.primary}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-foreground = ${colors.grey}
label-unfocused-padding = 1

label-urgent = %index%
label-urgent-foreground = ${colors.white}
label-urgent-background = ${colors.red}
label-urgent-padding = 1

[module/tray]
type = internal/tray

format-margin = 8px
tray-spacing = 8px
tray-size = 88%

[module/powermenu]
type = custom/menu

expand-right = true

format-spacing = 1

label-open = 
label-open-foreground = ${colors.black}
label-close =  cancel
label-close-foreground = ${colors.green}
label-separator = |
label-separator-foreground = ${colors.grey}

menu-0-0 = reboot
menu-0-0-exec = menu-open-1
menu-0-1 = power off
menu-0-1-exec = menu-open-2

menu-1-0 = cancel
menu-1-0-exec = menu-open-0
menu-1-1 = reboot
menu-1-1-exec = sudo reboot

menu-2-0 = power off
menu-2-0-exec = sudo poweroff
menu-2-1 = cancel
menu-2-1-exec = menu-open-0

[module/backlight]
type = internal/backlight
card = amdgpu_bl0
use-actual-brightness = true
poll-interval = 0
enable-scroll = true
scroll-interval = 10

format = "| <ramp> <label>"
;format = "%{A1:~/.config/polybar/scripts/set_brightness.sh up:}%{A3:~/.config/polybar/scripts/set_brightness.sh down:}%| <ramp> <label>%{A}%{A}"
label = "%{F#00F000}Backlight: %{F-} %percentage%% "
ramp-4 = 🌕
ramp-3 = 🌔
ramp-2 = 🌓
ramp-1 = 🌒
ramp-0 = 🌑

[module/pulseaudio]
type = internal/pulseaudio

; Sink to be used, if it exists (find using `pacmd list-sinks`, name field)
; If not, uses default sink
; sink = alsa_output.pci-0000_12_00.3.analog-stereo

; Use PA_VOLUME_UI_MAX (~153%) if true, or PA_VOLUME_NORM (100%) if false
; Default: true
use-ui-max = true

; Interval for volume increase/decrease (in percent points)
; Default: 5
interval = 5

; Reverses the increment/decrement on scroll event. Set this to true if you are
; using natural scrolling option on your touchpad.
; New in version 3.7.0
; Default: false
reverse-scroll = false

; Available tags:
;   <label-volume> (default)
;   <ramp-volume>
;   <bar-volume>
format-volume = " | <ramp-volume> <label-volume> | " 

; Available tags:
;   <label-muted> (default)
;   <ramp-volume>
;   <bar-volume>
;format-muted = <label-muted>

; Available tokens:
;   %percentage% (default)
;   %decibels%
;label-volume = %percentage%%

; Available tokens:
;   %percentage% (default)
;   %decibels%
label-muted = 🔇 muted
label-muted-foreground = #666

; Only applies if <ramp-volume> is used
ramp-volume-0 = 🔈
ramp-volume-1 = 🔉
ramp-volume-2 = 🔊

; Right and Middle click
click-right = pavucontrol
click-middle = pkill pavucontrol
; click-middle = 

[module/xwindow]
type = internal/xwindow
label = %{A1:~/.config/polybar/close_win.sh:}%{T4}%{F#f00}  %{F-}%{T-}%{A}
;label = %{A1:[ "$(echo -e 'Yes\nNo' | rofi -dmenu -p 'Close Window?')" = 'Yes' ] && xdotool getwindowfocus windowkill:}%{T4}%{F#f00}  %{F-}%{T-}%{A}

;label = %{A1:[ "$(echo -e 'No\nYes' | rofi -dmenu -p 'Close Window?')" = 'Yes' ] && xdotool getwindowfocus windowkill:}%title:0:30:...%%{A}

